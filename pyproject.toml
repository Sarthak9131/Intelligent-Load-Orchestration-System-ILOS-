[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
files = ["src", "evals", "examples"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src", "evals", "examples"]
omit = ["*/__init__.py"]

[tool.coverage.report]
show_missing = true
